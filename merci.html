<head>

  a{display:inline-flex;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.03em;padding:14px 28px;border:2px solid #fff;color:#fff;text-decoration:none;}

</style>
</head>
<body>
  <div class="check">✓</div>
  <h1>Merci !</h1>
